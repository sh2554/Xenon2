<div style="
  margin: 0;
  padding: 60px 20px;
  background-color: #0E0E0E;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: #F3F3F3;
">

  <div style="
    max-width: 520px;
    margin: 0 auto;
    text-align: center;
    padding: 20px 10px;
  ">

    <!-- Top Logo (Claude AI style) -->
    <div style="margin-bottom: 26px;">
      <div style="
        display: inline-block;
        width: 54px;
        height: 54px;
        line-height: 54px;
        background-color: #be185d;
        color: #ffffff;
        border-radius: 16px;
        font-family: monospace;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.5px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(190, 24, 93, 0.35);
      ">
        XC
      </div>
    </div>

    <!-- Title (Sign in to Xenon Code) -->
    <h1 style="
      color: #F3F3F3;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 32px 0;
      line-height: 1.25;
    ">
      Sign in to Xenon Code
    </h1>

    <!-- Claude-style dark center card -->
    <div style="
      background-color: #141414;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 24px;
      margin: 0 auto 28px auto;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    ">
      <a href="{{ .ConfirmationURL }}"
        style="
          background-color: #be185d;
          color: #ffffff;
          text-decoration: none;
          padding: 15px 36px;
          border-radius: 12px;
          font-weight: 700;
          font-size: 15px;
          display: inline-block;
          letter-spacing: 0.2px;
          box-shadow: 0 4px 18px rgba(190, 24, 93, 0.3);
        ">
        Verify Email &amp; Sign In
      </a>
    </div>

    <!-- Claude-style subtext -->
    <p style="
      color: #A1A1AA;
      font-size: 14px;
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto 40px auto;
    ">
      Click the button above to verify your email and sign in. If you didn't try to sign in, you can safely ignore this email.
    </p>

    <!-- Footer (Anthropic style) -->
    <div style="
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 26px;
      margin-top: 20px;
    ">
      <p style="
        color: #71717A;
        font-family: monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        margin: 0 0 8px 0;
      ">
        XENON CODE
      </p>
      <p style="
        color: #52525B;
        font-size: 12px;
        margin: 0;
      ">
        xenoncode.xyz &bull; Python IDE &bull; Learn &bull; Practise
      </p>
    </div>

  </div>
</div>
